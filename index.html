  :root {
    --fundo: #ffffff; --tinta: #1d1d1f; --fraca: #6e6e73; --acao: #0071e3; --acao-viva: #0077ed;

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }

  a.botao:hover { background: var(--acao-viva); }
